<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <style>
        html,
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: fixed;
            inset: 0;
            background: transparent;
            touch-action: none;
        }

        #stage-background,
        #stage-vignette,
        #live2d-canvas {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }

        #stage-background {
            z-index: 0;
            background-color: transparent;
            background-image: var(--stage-bg, none);
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            opacity: 1;
        }

        #stage-vignette {
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.20) 0%,
                rgba(0, 0, 0, 0.00) 38%,
                rgba(0, 0, 0, 0.36) 100%
            );
        }

        #live2d-canvas {
            z-index: 2;
            display: block;
            background: transparent;
            object-fit: cover;
            touch-action: none;
            opacity: 1;
        }
    </style>
</head>
<body>
<div id="stage-background"></div>
<div id="stage-vignette"></div>
<canvas id="live2d-canvas"></canvas>
<script src="./vendor/live2dcubismcore.min.js"></script>
<script src="./vendor/pixi.min.js"></script>
<script>
    window.PIXI = PIXI;
</script>
<script src="./vendor/cubism4.min.js"></script>
<script src="./stage.js"></script>
</body>
</html>
