<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <style>
        html,
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: fixed;
            inset: 0;
            background: transparent;
            touch-action: none;
        }

        #live2d-canvas,
        #fallback-image,
        #present-canvas,
        #present-image {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }

        #live2d-canvas,
        #fallback-image,
        #present-canvas,
        #present-image {
            z-index: 1;
            display: block;
            background: transparent;
            object-fit: cover;
            touch-action: none;
            opacity: 1;
        }

        #fallback-image {
            z-index: 2;
            object-fit: contain;
            object-position: center bottom;
            pointer-events: none;
        }

        #present-canvas {
            z-index: 3;
            pointer-events: none;
            visibility: hidden;
        }

        #present-image {
            z-index: 4;
            pointer-events: none;
            visibility: hidden;
        }

        #diagnostics {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: 12px;
            z-index: 5;
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 7px 10px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 8px;
            background: rgba(10, 14, 22, 0.72);
            color: #f8fbff;
            font: 12px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            pointer-events: none;
        }

        body.stage-selftest #diagnostics {
            display: grid;
        }

        .status-row {
            display: flex;
            min-width: 0;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .status-label {
            min-width: 0;
            overflow: hidden;
            color: rgba(248, 251, 255, 0.74);
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-value {
            color: #ffffff;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-wide {
            grid-column: 1 / -1;
        }

        .status-wide .status-value {
            overflow-wrap: anywhere;
            text-align: right;
            white-space: normal;
        }

        .status-ok {
            color: #7df0a9;
        }

        .status-bad {
            color: #ff8f9f;
        }

        #error {
            grid-column: 1 / -1;
            color: #ffb7c1;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body class="stage-home">
<canvas id="live2d-canvas"></canvas>
<img id="fallback-image" src="./fallbacks/haru-stage.png" alt="">
<canvas id="present-canvas"></canvas>
<img id="present-image" alt="">
<div id="diagnostics" aria-live="polite">
    <div class="status-row"><span class="status-label">Core loaded</span><span id="core" class="status-value status-bad">no</span></div>
    <div class="status-row"><span class="status-label">Framework loaded</span><span id="framework" class="status-value status-bad">no</span></div>
    <div class="status-row"><span class="status-label">Model loaded</span><span id="model" class="status-value status-bad">no</span></div>
    <div class="status-row"><span class="status-label">Drawable count</span><span id="drawables" class="status-value">0</span></div>
    <div class="status-row"><span class="status-label">Pixel alpha</span><span id="pixel-alpha" class="status-value">0</span></div>
    <div class="status-row"><span class="status-label">Model pixels</span><span id="model-pixels" class="status-value status-bad">0 / 0</span></div>
    <div class="status-row"><span class="status-label">Stage version</span><span id="version" class="status-value">boot</span></div>
    <div class="status-row status-wide"><span class="status-label">Bounds</span><span id="bounds" class="status-value">0,0 1x1</span></div>
    <div class="status-row status-wide"><span class="status-label">Pivot / scale</span><span id="fit" class="status-value">0,0 @ 0</span></div>
    <div class="status-row status-wide"><span class="status-label">Stage / pos</span><span id="position" class="status-value">0x0 / 0,0</span></div>
    <div class="status-row status-wide"><span class="status-label">Presenter</span><span id="presenter" class="status-value">0</span></div>
    <div id="error"></div>
</div>
<script src="./vendor/live2dcubismcore.min.js"></script>
<script src="./vendor/pixi.min.js"></script>
<script>
    window.PIXI = PIXI;
</script>
<script src="./vendor/cubism4.min.js"></script>
<script src="./stage.js?v=pixi-cubism-runtime-v10-transparent-dom-fallback"></script>
</body>
</html>
